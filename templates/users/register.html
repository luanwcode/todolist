<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list add tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-900 font-serif">

    <div class="flex flex-col p-10 items-center justify-center text-white">

        <form method="post" action="{% url 'users:register' %}" class="flex flex-col gap-4"> 
            {% csrf_token %}

            <div class="flex flex-col gap-1">
                <label class="font-medium text-white">Name</label>
                <input class="text-black px-2 py-1" type="text" placeholder="Username" name="username">
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-medium text-white">Email</label>
                <div class="flex flex-col">
                    <input class="text-black px-2 py-1" type="email" name="email" placeholder="youremail@mail.com" >
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-medium text-white">Password</label>
                <div class="flex flex-col">
                    <input class="text-black px-2 py-1" type="password" name="password" placeholder="Password_123" >
                </div>
            </div>
            
            <div class="flex items-center justify-center font-sans">
                <button type="submit" class="bg-green-600 hover:bg-green-500 text-white px-6 py-1 rounded-md">
                    Create
                </button>
            </div>
        </form>

    </div>

</body>
</html>
