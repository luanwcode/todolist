<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list edit task</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-900">

    <div class="flex flex-col p-10 items-center justify-center text-white">

        <form method="post" class="flex flex-col gap-4"> 
            {% csrf_token %}

            <div class="flex flex-col gap-1">
                <label class="font-medium text-white">Name</label>
                <div class="flex flex-col">
                    {{ form.name }}
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-medium text-white">Description</label>
                <div class="flex flex-col">
                    {{ form.description }}
                </div>
            </div>

            <div clas="flex flex-col gap-1">
                <label class="font-medium text-white">Completed</label>
                {{ form.completed }}
            </div>

            <div class="flex items-center justify-center">
                <button type="submit" class="bg-green-600 hover:bg-green-500 text-white px-6 py-1 rounded-md">
                    Save
                </button>
            </div>
        </form>

    </div>

</body>
</html>
